      <text x="600" y="570" text-anchor="middle" font-size="24" fill="#64748b">بخار الطبخ → منطقة التقاط الهود → خط الطرد</text>
    
  <text x="1100" y="625" text-anchor="end" font-size="18" font-weight="800" fill="#0284c7">VENTIC PRO • دليل التهوية</text>
